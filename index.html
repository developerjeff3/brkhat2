<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ربوظمنقسيةتىىىؤؤؤؤ😭 PS4 PS5 Exploit Host</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* إضافة أنيميشن الزر والشريط */
        .btn-gold {
            position: relative;
            overflow: hidden;
        }

        .btn-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: rgba(255, 255, 255, 0.35);
            transition: width 0.8s ease-in-out;
            border-radius: 14px;
        }

        .btn-text {
            position: relative;
            z-index: 2;
        }

        /* انميشن وميض الصفحة عند التفعيل */
        .flash-effect {
            animation: flashBurst 0.4s ease-out;
        }

        @keyframes flashBurst {
            0% { filter: brightness(1); }
            50% { filter: brightness(2) drop-shadow(0 0 30px #00d2ff); }
            100% { filter: brightness(1); }
        }
    </style>
</head>
<body>

    <!-- خلفية الجزيئات المضيئة والتفاعلية -->
    <canvas id="particles-canvas"></canvas>

    <div class="main-wrapper" id="wrapper">
        <div class="title-container">
            <h1 class="main-title">
                <span class="name-Brkhat">Brkhat</span>
                <span class="ps4-title">PS4</span>
                <span class="ps5-title">PS5</span>
            </h1>
            <div class="subtitle">Exploit Host</div>
            <div class="version-badge">FW 7.00 - 13.00</div>
        </div>
        
        <hr>
        
        <div id="menu">
            <h2 class="menu-title">GoldHEN Exploit Host</h2>
            
            <button class="btn-gold" id="exploitBtn" onclick="triggerExploit(event)">
                <div class="btn-progress" id="btnProgress"></div>
                <span class="btn-text" id="btnText">
                    <span class="btn-icon">»</span> GoldHEN 7.00 - 13.00 <span class="btn-icon">«</span>
                </span>
            </button>
            
            <div class="credit-container">
                <p class="credit">
                    Designed by <a href="#" class="credit-link">ربوظمنقسيةتىىىؤؤؤؤ😭</a>
                </p>
                <p class="thanks">A special thanks to all scene developers.</p>
            </div>
        </div>
    </div>

    <!-- سكربت التفاعل وحركة الجزيئات -->
    <script>
        // دالة تفاعل زر القولدهن عند الضغط
        function triggerExploit(e) {
            e.preventDefault();

            const btnText = document.getElementById('btnText');
            const btnProgress = document.getElementById('btnProgress');
            const wrapper = document.getElementById('wrapper');

            // 1. اهتزاز الهاتف (Haptic Feedback)
            if (navigator.vibrate) {
                navigator.vibrate([50, 30, 80]);
            }

            // 2. تشغيل صوت كليك إلكتروني خفيف
            playClickSound();

            // 3. تأثير وميض الصفحة
            wrapper.classList.add('flash-effect');

            // 4. تحريك شريط التحميل بداخل الزر وتغيير النص
            btnProgress.style.width = '100%';
            btnText.innerHTML = '⚡ Injecting Payload... 100%';

            // 5. التوجيه لصفحة الثغرة بعد 900 ملي ثانية
            setTimeout(() => {
                location.replace('ran/index.html');
            }, 900);
        }

        // صوت الكليك الإلكتروني عبر Web Audio API (بدون ملفات خارجية)
        function playClickSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.15);
                
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (err) {
                console.log('Audio Context not allowed yet');
            }
        }

        // --- سكربت الجزيئات الأصلي ---
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particlesArray = [];
        const numberOfParticles = Math.min(60, Math.floor(window.innerWidth / 20));

        let mouse = {
            x: null,
            y: null,
            radius: 120
        };

        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        window.addEventListener('mouseout', function() {
            mouse.x = null;
            mouse.y = null;
        });

        window.addEventListener('touchmove', function(event) {
            if(event.touches.length > 0) {
                mouse.x = event.touches[0].clientX;
                mouse.y = event.touches[0].clientY;
            }
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 1.2;
                this.speedY = (Math.random() - 0.5) * 1.2;
                this.color = Math.random() > 0.5 ? '#00d2ff' : '#ffd700';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width || this.x < 0) this.speedX = -this.speedX;
                if (this.y > canvas.height || this.y < 0) this.speedY = -this.speedY;

                if (mouse.x && mouse.y) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        this.x -= dx / 10;
                        this.y -= dy / 10;
                    }
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            particlesArray.length = 0;
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }
        init();

        function connectParticles() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x;
                    let dy = particlesArray[a].y - particlesArray[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 110) {
                        ctx.strokeStyle = `rgba(0, 210, 255, ${1 - distance / 110})`;
                        ctx.lineWidth = 0.6;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            connectParticles();
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
