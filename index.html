<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ربوظمنقسيةتىىىؤؤؤؤ😭 PS4 PS5 Exploit Host</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- خلفية الجزيئات المضيئة والتفاعلية -->
    <canvas id="particles-canvas"></canvas>

    <div class="main-wrapper">
        <div class="title-container">
            <h1 class="main-title">
                <span class="name-Brkhat">Brkhat</span>
                <span class="ps4-title">PS4</span>
                <span class="ps5-title">PS5</span>
            </h1>
            <div class="subtitle">Exploit Host</div>
            <div class="version-badge">FW 7.00 - 13.00</div>
        </div>
        
        <hr>
        
        <div id="menu">
            <h2 class="menu-title">GoldHEN Exploit Host</h2>
            
            <button class="btn-gold" onclick="location.replace('ran/index.html')">
                <span class="btn-icon">»</span> GoldHEN 7.00 - 13.00 <span class="btn-icon">«</span>
            </button>
            
            <div class="credit-container">
                <p class="credit">
                    Designed by <a href="#" class="credit-link">ربوظمنقسيةتىىىؤؤؤؤ😭</a>
                </p>
                <p class="thanks">A special thanks to all scene developers.</p>
            </div>
        </div>
    </div>

    <!-- سكربت حركة الجزيئات التفاعلية -->
    <script>
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particlesArray = [];
        const numberOfParticles = Math.min(60, Math.floor(window.innerWidth / 20));

        let mouse = {
            x: null,
            y: null,
            radius: 120
        };

        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        window.addEventListener('mouseout', function() {
            mouse.x = null;
            mouse.y = null;
        });

        window.addEventListener('touchmove', function(event) {
            if(event.touches.length > 0) {
                mouse.x = event.touches[0].clientX;
                mouse.y = event.touches[0].clientY;
            }
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 1.2;
                this.speedY = (Math.random() - 0.5) * 1.2;
                this.color = Math.random() > 0.5 ? '#00d2ff' : '#ffd700';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width || this.x < 0) this.speedX = -this.speedX;
                if (this.y > canvas.height || this.y < 0) this.speedY = -this.speedY;

                if (mouse.x && mouse.y) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        this.x -= dx / 10;
                        this.y -= dy / 10;
                    }
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            particlesArray.length = 0;
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }
        init();

        function connectParticles() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x;
                    let dy = particlesArray[a].y - particlesArray[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 110) {
                        ctx.strokeStyle = `rgba(0, 210, 255, ${1 - distance / 110})`;
                        ctx.lineWidth = 0.6;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            connectParticles();
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
