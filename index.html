<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brkhat PS4 PS5 Exploit Host</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #08090c;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .main-wrapper {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(15, 17, 23, 0.75);
            padding: 40px 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 210, 255, 0.1);
            backdrop-filter: blur(10px);
            width: 90%;
            max-width: 480px;
        }

        .main-title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .name-Brkhat {
            color: #ffd700;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
        }

        .ps4-title {
            color: #00d2ff;
            text-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
            margin: 0 5px;
        }

        .ps5-title {
            color: #ff2a5f;
            text-shadow: 0 0 12px rgba(255, 42, 95, 0.6);
        }

        .subtitle {
            font-size: 0.85rem;
            color: #a0a5b5;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .version-badge {
            display: inline-block;
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #ffd700;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        hr {
            border: none;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 210, 255, 0.4), transparent);
            margin: 25px 0;
        }

        .menu-title {
            font-size: 1.1rem;
            color: #e0e5f0;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .btn-gold {
            background: transparent;
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.15);
        }

        .btn-gold:hover {
            background: #ffd700;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            transform: translateY(-2px);
        }

        .btn-icon {
            margin: 0 5px;
        }

        .credit-container {
            margin-top: 25px;
            font-size: 0.78rem;
            color: #7a8294;
            line-height: 1.6;
        }

        .credit-link {
            color: #ffd700;
            text-decoration: none;
            font-weight: 600;
        }

        .thanks {
            margin-top: 4px;
            color: #555d6e;
            font-size: 0.72rem;
        }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <div class="main-wrapper">
        <div class="title-container">
            <h1 class="main-title">
                <span class="name-Brkhat">Brkhat</span>
                <span class="ps4-title">PS4</span>
                <span class="ps5-title">PS5</span>
            </h1>
            <div class="subtitle">Exploit Host</div>
            <div class="version-badge">FW 7.00 - 13.00</div>
        </div>
        
        <hr>
        
        <div id="menu">
            <h2 class="menu-title">GoldHEN Exploit Host</h2>
            
            <button class="btn-gold" onclick="location.replace('ran/index.html')">
                <span class="btn-icon">»</span> GoldHEN 7.00 - 13.00 <span class="btn-icon">«</span>
            </button>
            
            <div class="credit-container">
                <p class="credit">
                    Designed by <a href="#" class="credit-link">ربوظمنقسيةتىىىؤؤؤؤ😭</a>
                </p>
                <p class="thanks">A special thanks to all scene developers.</p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particlesArray = [];
        const numberOfParticles = Math.min(60, Math.floor(window.innerWidth / 20));

        let mouse = { x: null, y: null, radius: 120 };

        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = (Math.random() - 0.5) * 1.2;
                this.speedY = (Math.random() - 0.5) * 1.2;
                this.color = Math.random() > 0.5 ? '#00d2ff' : '#ffd700';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width || this.x < 0) this.speedX = -this.speedX;
                if (this.y > canvas.height || this.y < 0) this.speedY = -this.speedY;

                if (mouse.x && mouse.y) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        this.x -= dx / 10;
                        this.y -= dy / 10;
                    }
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            particlesArray.length = 0;
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }
        init();

        function connectParticles() {
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let dx = particlesArray[a].x - particlesArray[b].x;
                    let dy = particlesArray[a].y - particlesArray[b].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 110) {
                        ctx.strokeStyle = `rgba(0, 210, 255, ${1 - distance / 110})`;
                        ctx.lineWidth = 0.6;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            connectParticles();
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
